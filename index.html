<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Per Rob💜</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('sfondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .container {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
      overflow: hidden;
    }

    .flower-image {
      width: 100%;
      object-fit: cover;
      height: 300px;
    }

    .content {
      padding: 20px;
      text-align: center;
    }

    .card {
      background-color: #ebfffe;
      border: 1px solid #00bbb5;
      padding: 20px;
      margin-top: 20px;
      border-radius: 5px;
      font-style: italic;
      white-space: pre-wrap;
      word-wrap: break-word;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      line-height: 1.6;
      font-size: 1.2em;
    }

    /* 🌸 Stile del pulsante */
    .button-container {
      margin-top: 25px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      background-color: #37b3af;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1em;
      transition: background-color 0.3s, transform 0.2s;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #37b3af;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="flower-image" src="fiori.jpg" alt="Un bel mazzo di fiori" />
    <div class="content">
      <div class="card">
        Non solo parole, ma fatti è quello che voglio darvi.  
        Oggi e ogni giorno della mia e della vostra vita.  
        Ti amo da morire 💜  
        - Aurora
      </div>

      <!-- 🌷 Pulsante in basso -->
      <div class="button-container">
        <a href="cuore.html" class="btn">Clicca qui!</a>
      </div>
    </div>
  </div>
</body>
</html>
